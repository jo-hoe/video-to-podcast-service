{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "video-to-podcast-service.fullname" . }}-data
  labels:
    {{- include "video-to-podcast-service.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "video-to-podcast-service.fullname" . }}-ytdlp-bin
  labels:
    {{- include "video-to-podcast-service.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.ytDlp.binaryPvc.storageClass }}
  storageClassName: {{ .Values.ytDlp.binaryPvc.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ytDlp.binaryPvc.size }}

