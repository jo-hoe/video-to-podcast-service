# Default values for video-to-podcast-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/jo-hoe/video-to-podcast-service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

logLevel: info

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  enabled: true
  type: LoadBalancer
  port: 8081
  # Target port on the container (defaults to service.port if not specified)
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  # The service respects X-Forwarded-Proto and X-Forwarded-Host headers
  # for generating correct RSS feed URLs behind a reverse proxy.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: video-to-podcast.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: video-to-podcast-tls
  #    hosts:
  #      - video-to-podcast.local

resources:
  # -- We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Persistence configuration
persistence:
  # -- WARNING: Without persistence, all data (database, media files, cookies) will be lost on pod restart!
  enabled: false
  # -- Storage class for the persistent volume
  storageClass: ""
  # -- Access mode for the persistent volume
  accessMode: ReadWriteOnce
  # -- Size of the persistent volume
  size: 10Gi
  # -- Existing claim name if you want to use an existing PVC
  existingClaim: ""
  # -- Annotations for the PVC
  annotations: {}

# Database configuration
database:
  driver: sqlite3
  # Path is relative to the mount point in the container
  connectionString: "file:/app/data/database/video-to-podcast-service.db"

# Cookies configuration for YouTube authentication
cookies:
  enabled: false
  # -- Path is relative to the mount point in the container
  cookiePath: "/app/data/cookies/youtube-cookies.txt"
  # -- Base64 encoded content of the YouTube cookies file (optional)
  # If provided, a secret will be automatically created with this content
  # Example: cookieContent: "BASE64_ENCODED_COOKIE_STRING"
  cookieContent: ""
  # -- Secret name containing the cookies file (optional)
  # If provided, will use the existing secret instead of creating one
  # Note: secretName takes precedence over cookieContent
  secretName: ""

# -- Media configuration
media:
  # Paths are relative to the mount point in the container
  mediaPath: "/app/data/resources/media"
  tempPath: "/app/data/resources/temp"
  maxParallelDownloads: 1
  allowPartialDownloads: true

nodeSelector: {}

tolerations: []

affinity: {}

# -- yt-dlp configuration
ytDlp:
  # -- Pull the nightly build of yt-dlp instead of the version baked into the image.
  # The initContainer runs as root and writes the binary to a dedicated PVC that is
  # mounted read-only by the main container, so appuser never needs write access.
  # Enable when the stable release is broken and a nightly fix is already available.
  updateToNightly: false

  # -- PVC used by the initContainer to store the yt-dlp binary.
  # A separate small PVC avoids coupling the binary to the app data volume.
  # The PVC is not a cache — it is a handoff mechanism between the initContainer
  # (runs as root, writes the binary) and the main container (reads it as appuser).
  # The initContainer re-downloads on every pod start, so a pod restart always
  # picks up the latest build in the selected channel. This is intentional:
  # when updateToNightly is true a restart is the mechanism to get a newer nightly.
  binaryPvc:
    storageClass: ""
    size: 128Mi

  # -- Enable verbose yt-dlp output in logs (includes PO token and plugin debug lines).
  # Useful for diagnosing download failures. Keep false in production to reduce log noise.
  verbose: false

  # -- PO token sidecar configuration.
  # The bgutil-ytdlp-pot-provider HTTP server runs as a sidecar container and
  # automatically supplies Proof-of-Origin tokens to yt-dlp, which makes traffic
  # appear more legitimate to YouTube and reduces 403 errors.
  #
  # Failure behavior (by design):
  # - Sidecar crash: K8s restarts it via the liveness probe. While it is down
  #   the bgutil plugin raises PoTokenProviderRejectedRequest (not a hard error)
  #   so yt-dlp continues without a PO token — same behavior as without sidecar.
  # - Invalid tokens (e.g. YouTube updates Botguard): downloads may 403, same as
  #   without the sidecar. Use updateToNightly as the first mitigation lever.
  # - Plugin goes unmaintained: graceful degradation as above. No hard dependency.
  poTokenSidecar:
    # -- Enable the sidecar container that provides PO tokens to yt-dlp.
    enabled: true
    image:
      repository: brainicism/bgutil-ytdlp-pot-provider
      tag: "latest"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
