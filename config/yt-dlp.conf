# yt-dlp configuration for video-to-podcast-service
#
# PO token provider: point the bgutil HTTP plugin at the sidecar.
# In Kubernetes the sidecar runs in the same pod (localhost).
# In Docker Compose this file is volume-mounted from the host and
# should point at the bgutil-pot-provider service name instead:
#   --extractor-args "youtubepot-bgutilhttp:base_url=http://bgutil-pot-provider:4416"
--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
